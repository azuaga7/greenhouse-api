<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 12px;
            color: white;
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .logo-text {
            color: #f1f5f9;
            font-size: 24px;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .login-button {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .login-button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-1px);
        }
        
        .login-button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #dc2626;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">ADTEC</div>
            <div class="logo-text">Invernadero Pro</div>
        </div>
        
        <div id="error-message" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-input" 
                    placeholder="Ingrese su usuario"
                    required
                    autocomplete="username"
                />
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Ingrese su contraseña"
                    required
                    autocomplete="current-password"
                />
            </div>
            
            <button type="submit" id="loginButton" class="login-button">
                <span id="button-text">Iniciar Sesión</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('button-text');
            const errorMessage = document.getElementById('error-message');
            
            // Mostrar loading
            button.disabled = true;
            buttonText.innerHTML = '<span class="loading"></span>Validando...';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // CAPTURAR TODOS LOS DATOS DEL USUARIO
                    const userData = {
                        id: data.user.id,
                        username: data.user.username,
                        email: data.user.email,
                        role: data.user.role,
                        enabled: data.user.enabled,
                        apiKey: data.user.apiKey,
                        createdAt: data.user.createdAt
                    };
                    
                    // Guardar TODO en localStorage
                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('loginTime', new Date().toISOString());
                    
                    console.log('Usuario autenticado:', userData);
                    
                    // Redirigir al dashboard
                    window.location.href = 'index.html';
                } else {
                    throw new Error(data.message || 'Credenciales inválidas');
                }
            } catch (error) {
                console.error('Error de login:', error);
                errorMessage.textContent = error.message || 'Error de conexión. Intente nuevamente.';
                errorMessage.style.display = 'block';
                
                // Restaurar botón
                button.disabled = false;
                buttonText.textContent = 'Iniciar Sesión';
            }
        });
        
        // Enfocar en el campo usuario al cargar
        document.getElementById('username').focus();
    </script>
</body>
</html>
