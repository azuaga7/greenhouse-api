<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC Dashboard</title>
    
    <!-- Scripts Profesionales (Locales) - Generados Dinámicamente -->
    <script src="libs/react.production.min.js"></script>
    <script src="libs/react-dom.production.min.js"></script>
    <script src="libs/babel.min.js"></script>
    <script src="libs/chart.umd.js"></script>
    <script src="libs/chart.umd.min.js"></script>
    <script src="libs/docx.js"></script>
    <script src="libs/filesaver.min.js"></script>
    <script src="libs/lucide.min.js"></script>
    <script src="libs/marked.min.js"></script>
    <script src="libs/pako.min.js"></script>
    <script src="libs/purify.min.js"></script>
    <script src="libs/xlsx.full.min.js"></script>

    <style>
        
    :root { 
        --adtec-accent: #38bdf8; 
        --bg: #020617; 
        --surface: rgba(15, 23, 42, 0.8); 
        --border: rgba(148, 163, 184, 0.2); 
        --success: #22c55e; 
        --warn: #fbbf24; 
        --danger: #ef4444;
        --text: #f8fafc; 
        --text-muted: #94a3b8;
        
        /* Error fallback styles */
        --error-bg: #0f172a;
        --error-text: #f8fafc;
        --error-border: #334155;
        --error-title-color: #ef4444;
        --error-button-bg: #38bdf8;
        --error-button-text: #0f172a;
    }
    
    /* Typing cursor animation */
    .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background-color: #38bdf8;
        animation: blink 1s infinite;
        margin-left: 2px;
        vertical-align: text-bottom;
    }
    
    @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    .adtec-dashboard-root {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: 100vh;
        background: radial-gradient(circle at top, #020617 0, #020617 45%, #000 100%);
        color: #e5e7eb;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* LA TARJETA MAESTRA: Copia exacta del Editor */
    .adtec-card { 
        background: linear-gradient(145deg, rgba(15,23,42,0.97), rgba(15,23,42,0.7));
        border-radius: 16px; 
        padding: 25px; 
        position: relative; 
        backdrop-filter: blur(20px);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 18px 45px rgba(15,23,42,0.9);
        display: flex; 
        flex-direction: column;
        overflow: hidden;
    }

    .card-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        border-bottom: 1px solid rgba(148, 163, 184, 0.2); 
        padding-bottom: 15px; 
    }
    
    .logo-section { display: flex; align-items: center; gap: 12px; }
    .logo-icon { 
        width: 30px; height: 30px; 
        background: #fbbf24; 
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
    }
    .logo-icon-inner { font-size: 9px; font-weight: 900; color: black; letter-spacing: -0.5px; }
    .card-title { font-weight: 600; font-size: 18px; letter-spacing: 0.05em; color: #f8fafc; margin: 0; }

    .tabs-nav { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; width: 100%; justify-content: center; overflow: visible; }
    .tab-btn { 
        padding: 10px 20px; cursor: pointer; border-radius: 10px; font-size: 12px; font-weight: 700;
        transition: all 0.2s; color: var(--text-muted); border: 1px solid transparent;
        display: flex; align-items: center; gap: 10px; white-space: nowrap; text-transform: uppercase;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .tab-btn.active { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.2); color: var(--adtec-accent); }

    .card-body { 
        position: relative; background: rgba(0,0,0,0.2); border-radius: 12px; 
        border: 1px solid rgba(148, 163, 184, 0.1); overflow: hidden; flex: 1;
        display: flex; flex-direction: column;
    }
    .card-body-flat { 
        position: relative; flex: 1; display: flex; flex-direction: column;
    }
    .grid-bg { 
        position: absolute; inset: 0; 
        background-image: radial-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px); 
        background-size: 30px 30px; opacity: 0.5; pointer-events: none;
    }

    .widgets-area { position: relative; width: 100%; height: 100%; z-index: 1; flex: 1; }

    /* LOS WIDGETS: Copia exacta del Editor */
    .adtec-status-item { 
        position: absolute; padding: 12px 14px; border-radius: 12px;
        background: radial-gradient(circle at top, rgba(15,118,110,0.15), rgba(15,23,42,0.96));
        border: 1px solid rgba(45,212,191,0.2);
        display: flex; flex-direction: column; gap: 4px;
        transition: all 0.3s ease; backdrop-filter: blur(5px);
    }
    .adtec-status-item h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin: 0; font-weight: 700; }
    .adtec-status-value { font-size: 20px; font-weight: 700; color: var(--adtec-accent); }
    .adtec-status-sub { font-size: 10px; color: #9ca3af; }
    
    .adtec-temp-bar { 
        width: 100%; height: 6px; background: rgba(15,23,42,0.8); 
        border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 4px; 
        overflow: hidden; margin-top: 5px; position: relative; 
    }
    .adtec-temp-bar-fill { 
        height: 100%; width: 0%; background: var(--adtec-accent);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
    }

    .adtec-status-chip { 
        display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; 
        border-radius: 999px; font-size: 10px; font-weight: 700; margin-top: auto; 
        border: 1px solid rgba(148, 163, 184, 0.3); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .adtec-status-chip.on { background: rgba(34,197,94,0.1); color: #22c55e; border-color: rgba(34,197,94,0.4); }
    .adtec-status-chip.warn { background: rgba(251,191,36,0.1); color: #fbbf24; border-color: rgba(251,191,36,0.4); }
    .adtec-status-chip.off { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.4); }
    
    .adtec-status-dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
    .adtec-status-dot.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .adtec-status-dot.warn { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
    .adtec-status-dot.off { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    .vfd-btn { 
        flex: 1; padding: 6px; border-radius: 4px; 
        border: 1px solid rgba(255,255,255,0.1); color: white; 
        font-weight: 800; font-size: 10px; cursor: pointer; 
        transition: all 0.2s; background: rgba(255,255,255,0.05);
        text-transform: uppercase; letter-spacing: 0.05em;
        display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .vfd-btn:hover { background: rgba(255,255,255,0.1); }
    .vfd-btn:active { transform: scale(0.98); }
    .vfd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .vfd-btn.start { background: rgba(34, 197, 94, 0.2); color:rgb(214, 245, 245); border-color: #22c55e; }
    .vfd-btn.stop { background: rgba(239, 68, 68, 0.2); color:rgb(255, 204, 204); border-color: #ef4444; }

    .adtec-security-banner {
        margin-top: 25px; padding: 15px 20px; 
        background: rgba(250,204,21,0.05); border-radius: 10px; 
        border: 1px solid rgba(250,204,21,0.2); display: flex; 
        gap: 15px; align-Items: center;
    }
    .adtec-security-banner p { margin: 0; font-Size: 11px; color: #fbbf24; line-Height: 1.5; }


    .vfd-dial {
        width: 100px; height: 100px; border-radius: 50%; border: 6px solid #1e293b; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.2); transition: all 0.3s ease; position: relative;
    }
    .vfd-dial.on { border-top-color: var(--adtec-accent); box-shadow: 0 0 15px rgba(56,189,248,0.2); }
    .vfd-dial-value { font-size: 18px; font-weight: 900; color: white; }
    .vfd-dial.on .vfd-dial-value { color: var(--adtec-accent); }
    .vfd-dial-unit { font-size: 8px; color: #9ca3af; }

    .switch { position: relative; display: inline-block; width: 38px; height: 22px; transform: scale(0.7); }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
        position: absolute; cursor: pointer; inset: 0; 
        background-color: rgba(148, 163, 184, 0.2); transition: .2s; border-radius: 22px; 
    }
    .slider:before { 
        position: absolute; content: ""; height: 16px; width: 16px; 
        left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; 
    }
    input:checked + .slider { background-color: var(--adtec-accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    .gsm-bars { display: flex; gap: 2px; align-items: flex-end; height: 20px; }
    .gsm-bar { width: 3px; background: rgba(255,255,255,0.1); border-radius: 1px; }
    .gsm-bar.active { background: var(--adtec-accent); box-shadow: 0 0 8px var(--adtec-accent); }

    .adtec-label-widget {
        pointer-events: none; white-space: pre-wrap; font-family: 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center;
    }

    .adtec-sparkline-container {
        width: 100%;
        height: 45px;
        margin-top: 12px;
        overflow: visible;
        position: relative;
    }
    /* Punto 2: Removido para usar motor real */
    .adtec-sparkline-svg {
        width: 100%;
        height: 100%;
        display: block;
    }
    .adtec-sparkline-path {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
    }

    .alert-badge {
        background: var(--danger);
        color: white;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        position: absolute;
        top: -5px;
        right: -5px;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        animation: pulse 2s infinite;
        font-weight: 800;
        z-index: 10;
    }

    /* Error fallback styles */
    .error-fallback {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--error-bg);
        color: var(--error-text);
        font-family: sans-serif;
        padding: 40px;
        box-sizing: border-box;
        z-index: 9999;
    }

    .error-title {
        color: var(--error-title-color);
        margin-bottom: 20px;
    }

    .error-message {
        font-size: 18px;
        line-height: 1.6;
    }

    .error-details {
        background: var(--error-border);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--error-border);
        margin-top: 20px;
        font-family: monospace;
        white-space: pre-wrap;
        color: var(--error-text);
        max-height: 400px;
        overflow-y: auto;
    }

    .error-retry-btn {
        margin-top: 30px;
        padding: 12px 25px;
        background: var(--error-button-bg);
        color: var(--error-button-text);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    .alert-card-item {
        border-radius: 12px;
        display: flex;
        overflow: hidden;
        transition: transform 0.2s;
        border-left: 4px solid #ef4444 !important;
        background: rgba(239, 68, 68, 0.15);
        border-top: 1px solid rgba(239, 68, 68, 0.4);
        border-right: 1px solid rgba(239, 68, 68, 0.4);
        border-bottom: 1px solid rgba(239, 68, 68, 0.4);
    }
    
    .alert-card-item.alert-critical {
        border-left-color: #dc2626 !important;
        background: rgba(220, 38, 38, 0.15);
        border-top-color: rgba(220, 38, 38, 0.4);
        border-right-color: rgba(220, 38, 38, 0.4);
        border-bottom-color: rgba(220, 38, 38, 0.4);
    }
    
    .alert-card-item.alert-warning {
        border-left-color: #d97706 !important;
        background: rgba(217, 119, 6, 0.15);
        border-top-color: rgba(217, 119, 6, 0.4);
        border-right-color: rgba(217, 119, 6, 0.4);
        border-bottom-color: rgba(217, 119, 6, 0.4);
    }
    
    .alert-card-item.alert-info {
        border-left-color: #2563eb !important;
        background: rgba(37, 99, 235, 0.15);
        border-top-color: rgba(37, 99, 235, 0.4);
        border-right-color: rgba(37, 99, 235, 0.4);
        border-bottom-color: rgba(37, 99, 235, 0.4);
    }
    
    .alert-card-item.alert-state {
        border-left-color: #7c3aed !important;
        background: rgba(124, 58, 237, 0.15);
        border-top-color: rgba(124, 58, 237, 0.4);
        border-right-color: rgba(124, 58, 237, 0.4);
        border-bottom-color: rgba(124, 58, 237, 0.4);
    }
    
    .alert-card-item.alert-default {
        border-left-color: #0891b2 !important;
        background: rgba(8, 145, 178, 0.15);
        border-top-color: rgba(8, 145, 178, 0.4);
        border-right-color: rgba(8, 145, 178, 0.4);
        border-bottom-color: rgba(8, 145, 178, 0.4);
    }
    
    .alert-card-side {
        width: 6px;
        background: #ef4444;
        flex-shrink: 0;
    }

    .alert-card-content {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .alert-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .alert-card-tag {
        background: #ef4444;
        color: white;
        font-size: 9px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 4px;
        letter-spacing: 0.05em;
    }
    
    .alert-card-tag.tag-critical {
        background: #dc2626;
    }
    
    .alert-card-tag.tag-warning {
        background: #d97706;
    }
    
    .alert-card-tag.tag-info {
        background: #2563eb;
    }
    
    .alert-card-tag.tag-state {
        background: #7c3aed;
    }
    
    .alert-card-tag.tag-default {
        background: #0891b2;
    }

    .alert-card-time {
        font-size: 11px;
        color: #94a3b8;
    }

    .alert-card-msg {
        font-size: 16px;
        font-weight: 700;
        color: #f8fafc;
    }

    .alert-card-detail {
        font-size: 12px;
        color: #94a3b8;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* Definición Global de Degradados por Porcentaje */
    .gauge-gradient-normal {
        --grad-start: var(--gauge-pct-0, #10b981);
        --grad-mid: var(--gauge-pct-50, #f59e0b);
        --grad-end: var(--gauge-pct-100, #ef4444);
    }

    .gauge-gradient-inverted {
        --grad-start: var(--gauge-pct-100, #ef4444);
        --grad-mid: var(--gauge-pct-50, #f59e0b);
        --grad-end: var(--gauge-pct-0, #10b981);
    }

    /* Estilos para Markdown content en mensajes de IA */
    .markdown-content h1, .markdown-content h2, .markdown-content h3 {
        margin: 8px 0 4px 0;
        font-weight: 600;
        line-height: 1.3;
    }
    .markdown-content h1 { 
        font-size: 16px; 
        color: #c4b5fd; 
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        padding-bottom: 2px;
    }
    .markdown-content h2 { 
        font-size: 14px; 
        color: #e9d5ff; 
    }
    .markdown-content h3 { 
        font-size: 13px; 
        color: #f3e8ff; 
    }
    
    .markdown-content p { 
        margin: 6px 0; 
        line-height: 1.4; 
    }
    
    .markdown-content ul, .markdown-content ol { 
        margin: 6px 0; 
        padding-left: 16px; 
    }
    .markdown-content li { 
        margin: 2px 0; 
        line-height: 1.3;
    }
    
    .markdown-content strong, .markdown-content b { 
        font-weight: 600; 
        color: #f9fafb; 
    }
    
    .markdown-content em, .markdown-content i { 
        font-style: italic; 
        color: #e2e8f0; 
    }
    
    .markdown-content code { 
        background: rgba(139, 92, 246, 0.2); 
        padding: 2px 4px; 
        border-radius: 3px; 
        font-family: 'Courier New', monospace; 
        font-size: 12px;
        color: #e9d5ff;
        border: 1px solid rgba(139, 92, 246, 0.3);
    }
    
    .markdown-content pre {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 6px;
        padding: 8px;
        margin: 6px 0;
        overflow-x: auto;
    }
    
    .markdown-content pre code {
        background: transparent;
        border: none;
        padding: 0;
        font-size: 11px;
    }
    
    .markdown-content hr { 
        border: none; 
        border-top: 1px solid rgba(139, 92, 246, 0.3); 
        margin: 8px 0; 
    }
    
    .markdown-content blockquote {
        border-left: 3px solid rgba(139, 92, 246, 0.5);
        padding-left: 12px;
        margin: 6px 0;
        font-style: italic;
        color: #e2e8f0;
    }
    
    .markdown-content a {
        color: #a78bfa;
        text-decoration: underline;
    }
    
    .markdown-content a:hover {
        color: #c4b5fd;
    }

    </style>
</head>

// --- Timezone display helpers (Paraguay) ---
const TZ_PY = 'America/Asuncion'; // UTC-3
const asDate = (x) => (x instanceof Date) ? x : new Date(x);
const fmtPY = (x, opts) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ_PY, ...opts }).format(asDate(x));
const fmtPYTime = (x) => fmtPY(x, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const fmtPYDate = (x) => fmtPY(x, { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtPYDayMonth = (x) => fmtPY(x, { day: '2-digit', month: '2-digit' });

// Formateo personalizado para fechas en español con formato solicitado
const fmtFechaLarga = (x) => {
    let d;
    if (typeof x === 'string' && x.includes('T')) {
        // Formato datetime-local: "2026-03-01T20:04"
        d = new Date(x + ':00'); // Agregar segundos para formato completo
    } else {
        d = asDate(x);
    }
    
    // Verificar que la fecha es válida
    if (isNaN(d.getTime())) {
        return '--';
    }
    
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const diaSemana = dias[d.getDay()];
    const dia = d.getDate().toString().padStart(2, '0');
    const mes = (d.getMonth() + 1).toString().padStart(2, '0');
    const año = d.getFullYear();
    const horas = d.getHours().toString().padStart(2, '0');
    const minutos = d.getMinutes().toString().padStart(2, '0');
    return diaSemana + ', ' + dia + '/' + mes + '/' + año + ' ' + horas + ':' + minutos + ' hs PY';
};

// --- Normalización global (API flat sin kv.) ---
// Quita "kv." si existe
const normKey = (k) => (typeof k === 'string' && k.startsWith('kv.')) ? k.slice(3) : k;

// Lee valor tolerante: primero key limpia, luego prueba "kv."+key por compat
const getVal = (obj, key) => {
    if (!obj || !key) return undefined;
    const nk = normKey(key);
    if (obj[nk] !== undefined) return obj[nk];
    const legacy = 'kv.' + nk;
    if (obj[legacy] !== undefined) return obj[legacy];
    return undefined;
};

// Normaliza cualquier payload a flat sin "kv."
const normalizePoint = (raw) => {
    if (!raw || typeof raw !== 'object') return raw;
    const src = (raw.kv && typeof raw.kv === 'object') ? raw.kv : raw;
    const out = {};
    if (raw.timestamp) out.timestamp = raw.timestamp;
    for (const k in src) {
        if (k === 'timestamp') continue;
        out[normKey(k)] = src[k];
    }
    if (!out.timestamp) out.timestamp = new Date().toISOString();
    return out;
};

// Helper para formatear valores con unidad y formato
const formatValue = (val, format, unit) => {
  if (val === null || val === undefined) return '--';
  
  const num = parseFloat(val);
  if (isNaN(num)) return val;
  
  switch (format) {
    case 'fixed1': return num.toFixed(1) + (unit || '');
    case 'fixed2': return num.toFixed(2) + (unit || '');
    case 'time_hm': {
      const d = new Date(val * 1000);
      return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    case 'time_hms': {
      const d = new Date(val * 1000);
      return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    case 'bool_onoff': return num ? 'ON' : 'OFF';
    case 'percent': return num.toFixed(1) + '%';
    case 'datetime_full': {
      const d = new Date(val * 1000);
      return d.toLocaleString('es-ES');
    }
    case 'datetime_hm_full': {
      const d = new Date(val * 1000);
      return d.toLocaleString('es-ES', { 
        hour: '2-digit', 
        minute: '2-digit',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }
    default: return val + (unit || '');
  }
};

// --- COMPONENTE SPARKLINE ---
const Sparkline = ({ id, data, width = 100, height = 50, strokeColor = '#38bdf8', strokeWidth = 2 }) => {
    if (!data || data.length < 2) return null;
    
    const values = data.map(d => d.v).filter(v => v !== null && v !== undefined && !isNaN(v));
    if (values.length === 0) return null;
    
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    
    const points = data.map((d, i) => {
        const x = (i / (data.length - 1)) * width;
        const y = height - ((d.v - min) / range) * height;
        return `${x},${y}`;
    }).join(' ');
    
    return React.createElement('svg', {
        width: width,
        height: height,
        style: { overflow: 'visible' }
    }, [
        React.createElement('polyline', {
            points: points,
            fill: 'none',
            stroke: strokeColor,
            strokeWidth: strokeWidth,
            strokeLinecap: 'round',
            strokeLinejoin: 'round'
        })
    ]);
};

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command, value, id: commandId })

        .then(data => {
            if (data.success) {
                setPendingCommands(prev => {
                    const newCommands = { ...prev };
                    delete newCommands[command];
                    return newCommands;
                });
            }
        })
        .catch(error => {
            console.error('Error enviando comando:', error);
            setPendingCommands(prev => {
                const newCommands = { ...prev };
                delete newCommands[command];
                return newCommands;
            });
        });

            }
        })

            const errorMessage = { role: 'assistant', content: 'Error al procesar tu mensaje.', timestamp: Date.now() };
