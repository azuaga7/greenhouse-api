<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .loading-container {
            text-align: center;
            color: white;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .loading-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-text">ADTEC Dashboard</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; opacity: 0.8;">Cargando...</div>
    </div>

    <script>
        // Router inteligente de ADTEC
        (function() {
            const hasUsers = true;
            
            if (hasUsers) {
                // Hay usuarios configurados → verificar sesión
                const currentUser = localStorage.getItem('currentUser');
                const authToken = localStorage.getItem('authToken');
                
                if (currentUser && authToken) {
                    try {
                        // Validar que el token no esté expirado
                        const userData = JSON.parse(currentUser);
                        const loginTime = localStorage.getItem('loginTime');
                        
                        if (loginTime) {
                            const elapsed = Date.now() - parseInt(loginTime);
                            const maxAge = 15 * 60 * 1000; // 15 minutos
                            
                            if (elapsed > maxAge) {
                                // Sesión expirada → limpiar y redirigir a login
                                localStorage.removeItem('currentUser');
                                localStorage.removeItem('authToken');
                                localStorage.removeItem('loginTime');
                                window.location.href = 'login.html';
                                return;
                            }
                        }
                        
                        // Sesión válida → ir al dashboard
                        window.location.href = 'dashboard.html';
                        
                    } catch (error) {
                        console.error('Error validando sesión:', error);
                        localStorage.clear();
                        window.location.href = 'login.html';
                    }
                } else {
                    // No hay sesión → ir a login
                    window.location.href = 'login.html';
                }
            } else {
                // No hay usuarios → ir directo al dashboard
                window.location.href = 'dashboard.html';
            }
        })();
    </script>
</body>
</html>
